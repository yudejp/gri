services:
  gri:
    hostname: gri
    build:
      context: .
    image: ghcr.io/yudejp/gri:${GRI_IMAGE_TAG:-latest}
    container_name: gri
    restart: always
    environment:
      - TZ=Asia/Tokyo
    command:
      - sh
      - -lc
      - |
        set -eu
        grapher -h 0.0.0.0 -p 9292 &
        web_pid=$$!
        trap 'kill "$$web_pid" 2>/dev/null || true; exit 0' INT TERM
        interval="$${GRI_INTERVAL:-300}"
        while true; do
          if ! kill -0 "$$web_pid" 2>/dev/null; then
            echo "grapher exited" >&2
            exit 1
          fi
          started_at=$$(date +%s)
          gri
          elapsed=$$(( $$(date +%s) - started_at ))
          if [ "$$elapsed" -lt "$$interval" ]; then
            sleep "$$((interval - elapsed))"
          fi
        done
